[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rd-intelligence"
version = "0.1.0"
description = "External debug intelligence layer for RenderDoc: thin adapter (Layer 1), query engine and lazy-graph analysis (Layer 2)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "rd-intelligence contributors" }]
keywords = ["renderdoc", "graphics-debugging", "replay", "analysis"]
dependencies = [
  # Private-memory accounting for the WorkerManager recycle policy
  # (DESIGN_SPEC §2.9 makes the private-bytes delta a MUST gate). Without
  # it the memory trigger is silently unevaluable; Windows provides
  # memory_info().private, which is the commit charge the gate needs.
  "psutil>=5.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # The MIT classifier was removed deliberately. PEP 639 supersedes it with the
    # `license` expression and `license-files` above, and setuptools >= 78 refuses
    # to build while both are present -- so this was not a style preference, it
    # was an unbuildable package that no test noticed.
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
rdebug = "rdebug.cli:main"
rdebug-mcp = "rdebug_mcp.server:main"
rdebug-ide = "rdebug_ide.app:main"

[project.optional-dependencies]
# The upper bound is load-bearing, not caution. mcp 2.x renamed FastMCP to
# MCPServer, so `rd-intelligence[mcp]` on an unbounded range resolves to a
# server that cannot import its own transport -- installed cleanly, then exits 1
# on first launch, which is exactly the failure the extra exists to prevent.
# Verified against mcp 2.3.0: `No module named 'mcp.server.fastmcp'`.
mcp = ["mcp>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Without this the wheel builds cleanly and silently omits the IDE page: pip
# reports success, `rdebug-ide` starts, and it serves nothing. setuptools does not
# collect .html on its own without MANIFEST.in or a VCS plugin, and neither
# exists here, so the asset has to be declared.
rdebug_ide = [
  "static/*.html",
  # The built React bundle. Only dist/ ships: node_modules is a build input,
  # not a runtime dependency, and shipping it would add tens of megabytes of
  # third-party code to every install.
  "static/ui/dist/*",
  "static/ui/dist/assets/*",
]

[tool.pytest.ini_options]
# Both suites are in the default run. tests_transport was previously absent
# here, which made the 31 transport tests silently skip under a bare
# `pytest` while still looking "green" in the core suite.
testpaths = ["tests", "tests_transport"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP009", "UP035", "UP006", "UP007", "B904"]
