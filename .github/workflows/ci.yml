name: ci

# Concrete instantiation of ci-pipeline.json for GitHub Actions.
#
# Two facts about this file are recorded rather than smoothed over.
#
# rd-intelligence has no git remote, so this configuration cannot execute
# today. It is a declaration that can be audited, not a pipeline that runs.
#
# A GitHub-hosted runner has no GPU and no RenderDoc replay runtime, and this
# repository has no sibling ../renderdoc checkout. The two replay gates
# (integration and cold_warm_equivalence) and the fork integrity gate
# therefore cannot run there. The correct outcome of that is
# INFRASTRUCTURE_FAILURE, which this pipeline reports as a failure with
# conclusion "failure" and a neutral-to-failure distinction preserved in the
# report. Making them pass on a GPU-less runner would require fabricating
# validation, which section 4.1 forbids.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  section4-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff is installed here rather than left to chance. The unit gate probes
      # `ruff --version` as a precondition and classify_lint maps an unrunnable
      # lint to INFRASTRUCTURE_FAILURE, so without this extra the gate reports
      # executed=0 and never reaches a test. Installing it fixes that
      # precondition only -- it does not make lint or unit pass.
      - name: Install the package and its lint dependencies
        run: python -m pip install -e ".[lint]"

      - name: Run the section 4 gates
        id: gates
        run: python scripts/ci_pipeline.py --json ci_pipeline_report.json

      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ci_pipeline_report.json
            gate_report.json
            # Raw per-gate output. gate_report.json names the file for each
            # gate under "evidence", and .gate-logs/MANIFEST.json indexes the
            # same paths, so a reference in the report resolves to a real file
            # in this artifact.
            .gate-logs/
          # Without this the artifact is built without .gate-logs: the action
          # excludes dotfiles by default, and a directory named with a leading
          # dot is exactly what it excludes. Run 38081667018 captured and
          # indexed every gate log and shipped none of them, so captured:true
          # pointed at a path no download contained. The path list above names
          # two plain files and one explicit directory, so widening this cannot
          # reach .git, .github or any other hidden path in the checkout.
          include-hidden-files: true

      - name: Release blocking is not enabled
        if: always()
        run: |
          echo "release blocking is NOT authorized; an exit 4 is a legitimate"
          echo "resting state and must not be treated as a green build."

  # A separate job on purpose. The gates above cannot pass on a hosted runner, so
  # folding packaging into them would make a real packaging failure
  # indistinguishable from the infrastructure failure that is already expected
  # there. This job needs no GPU, no RenderDoc and no sibling checkout, so a
  # failure here is a statement about the package.
  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The wheel ships the React bundle, and the bundle is a build output that
      # is gitignored, so a fresh checkout has none. Without this the build
      # would ship a wheel whose /ui answers 404 -- which pip reports as a
      # perfectly good install.
      - name: Build the React bundle
        working-directory: src/rdebug_ide/static/ui
        run: |
          npm ci
          npm run build

      - name: Install the build backend
        run: python -m pip install --upgrade build

      - name: Build the distributions and check their contents
        id: build
        run: |
          python scripts/build_package.py \
            --outdir dist \
            --clean \
            --json build_report.json

      - name: Upload the distributions and the build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            build_report.json

      - name: What this job does not cover
        if: always()
        run: |
          echo "a green package-build means the artifacts are complete and"
          echo "installable. It says nothing about the replay gates, which"
          echo "remain INFRASTRUCTURE_FAILURE on this runner, and it is not"
          echo "release blocking."
