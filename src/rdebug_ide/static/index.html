<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rdebug-ide</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --fg:#d8dce3; --dim:#8a919d;
          --accent:#5aa2ff; --bad:#ff6b6b; --good:#69d58c; --warn:#e8c468; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { padding:10px 16px; background:var(--panel); display:flex;
           gap:16px; align-items:center; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #cibase { margin-left:auto; }
  .badge { padding:2px 10px; border-radius:10px; font-weight:600; }
  .pass { background:#123b24; color:var(--good); }
  .regression { background:#3b1216; color:var(--bad); }
  main { display:flex; gap:12px; padding:12px 16px; flex-wrap:wrap; }
  .card { background:var(--panel); border-radius:8px; padding:12px 14px;
          min-width:340px; flex:1; }
  .card h2 { font-size:13px; margin:0 0 8px; color:var(--dim);
             text-transform:uppercase; letter-spacing:.06em; }
  input, button { background:#23262d; color:var(--fg); border:1px solid #33373f;
                  border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:2px 10px; }
  .kv .k { color:var(--dim); }
  .layer { display:flex; gap:8px; padding:1px 0; }
  .st-same { color:var(--good); } .st-different { color:var(--bad); }
  .st-unknown { color:var(--warn); }
  .tree { margin:4px 0 4px 10px; border-left:1px solid #33373f; padding-left:10px; }
  .chip { display:inline-block; background:#23262d; border:1px solid #33373f;
          border-radius:6px; padding:1px 8px; margin:2px 4px 2px 0;
          font-family:Consolas,monospace; font-size:12px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  #evdetail { font-family:Consolas,monospace; font-size:12px; white-space:pre;
              background:#14161a; padding:8px; border-radius:6px; margin-top:6px;
              max-height:220px; overflow:auto; }
  #prompt { width:100%; height:220px; background:#14161a; color:var(--fg);
            border:1px solid #33373f; border-radius:6px; font-family:Consolas,monospace;
            font-size:12px; }
  .err { color:var(--bad); }
  .muted { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>rdebug-ide</h1>
  <span class="muted" id="capture"></span>
  <span id="cibase" class="muted" data-i18n="ci.baseline">CI baseline: not loaded</span>
  <button id="btnLang" title="Switch interface language">中文</button>
</header>
<main>
  <div class="card" style="max-width:420px">
    <h2 data-i18n="h.query">Query</h2>
    <div style="display:grid;gap:6px">
      <label data-i18n="l.a">A (x,y) <input id="a" value="320,240" size="8"></label>
      <label data-i18n="l.b">B (x,y) <input id="b" value="10,10" size="8"></label>
      <label data-i18n="l.deep"><input type="checkbox" id="deep"> deep diff (shader debugger)</label>
      <label data-i18n="l.eid">Event ID (optional) <input id="eid" size="6"></label>
      <div class="muted" id="eidscope" data-i18n-html="eidScope">
        Applies to: <b>Trace</b>, <b>Resource</b>.
        Does not apply to: <b>Diff</b>, <b>Generate AI Prompt</b>
        (they use the default event).
      </div>
      <div>
        <button id="btnDiff" data-i18n="b.diff">Diff A vs B</button>
        <button id="btnTrace" data-i18n="b.trace">Trace A</button>
        <button id="btnExplain" disabled data-i18n="b.explain">Generate AI Prompt</button>
      </div>
    </div>
    <div id="ci" style="margin-top:10px"></div>
  </div>
  <div class="card" style="flex:2">
    <h2 data-i18n="h.result">Result</h2>
    <div id="result" class="muted" data-i18n="res.blank">run a query…</div>
  </div>
  <div class="card" style="flex:1">
    <h2 data-i18n="h.evidence">Evidence</h2>
    <div id="evidence" class="muted">—</div>
    <div id="evdetail" style="display:none"></div>
    <h2 style="margin-top:12px" data-i18n="h.prompt">AI Prompt (grounded)</h2>
    <textarea id="prompt" readonly data-i18n-placeholder="res.hint" placeholder="[Generate AI Prompt] 先运行一次 diff"></textarea>
    <button id="btnCopy" style="margin-top:6px" disabled data-i18n="b.copy">Copy prompt</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
let lastDiff = null;
const MAX_DRAWS = 16;   // explicit scope; truncation is surfaced, not hidden

// ---------------------------------------------------------------------------
// Interface language.
//
// English is the default: every frozen test in this repository asserts the
// English source literals, and the interface is authored in English. Chinese
// is additive -- `data-i18n` names a group.key, and a key with no translation
// leaves the element's own text in place instead of blanking it.
//
// showFailure() deliberately takes no language lookup. test_ide_d11_request_identity
// and test_ide_d9_explain extract it together with esc, showOk, enter, claim,
// isStale, enterSeq and `const FAILURE_TEXT`, then execute that set in a bare
// Node process containing no i18n symbols, so a reference added here would be a
// ReferenceError at runtime. The failure banner is therefore translated by
// assigning into the one frozen FAILURE_TEXT object: showFailure stays
// self-contained and keeps its `FAILURE_TEXT[kind] || FAILURE_TEXT.api_error`
// fallback for an unrecognised kind.
//
// The default is `en` rather than a navigator.language probe, because the page
// is English and this repository has never established browser-level rendering;
// inferring a language nobody can test here would be an unverifiable default.
const I18N = {
  en: {
    langLabel: "中文",
    h: {query:"Query", result:"Result", evidence:"Evidence", prompt:"AI Prompt (grounded)"},
    l: {a:"A (x,y)", b:"B (x,y)", deep:"deep diff (shader debugger)", eid:"Event ID (optional)"},
    b: {diff:"Diff A vs B", trace:"Trace A", explain:"Generate AI Prompt", copy:"Copy prompt"},
    eidScope: 'Applies to: <b>Trace</b>, <b>Resource</b>. Does not apply to: <b>Diff</b>, <b>Generate AI Prompt</b> (they use the default event).',
    res: {blank:"run a query…", hint:"[Generate AI Prompt] run a diff first",
          loading:"loading…"},
    diff: {comparison:"comparison", firstDivergence:"first divergence", good:"good",
           bad:"bad", layers:"Layers"},
    trace: {target:"target", modifications:"modifications", finalValue:"final value",
            reads:"Reads", truncatedShort:" (truncated)",
            truncated:"Trace truncated &mdash; showing {n} of a larger set of modifications. This result is incomplete.",
            writtenBy:"written by {id}"},
    ci: {baseline:"CI baseline: not loaded", pass:"CI PASS"},
    failure: {
      transport_error: "Cannot reach the rdebug-ide service",
      malformed: "The service returned a response that is not JSON",
      api_error: "The service rejected the request",
    },
  },
  zh: {
    langLabel: "English",
    h: {query:"查询", result:"结果", evidence:"证据",
        prompt:"AI 提示词（有依据）"},
    l: {a:"A (x,y)", b:"B (x,y)", deep:"深度 diff（着色器调试器）",
        eid:"事件 ID（可选）"},
    b: {diff:"对比 A 与 B", trace:"追踪 A",
        explain:"生成 AI 提示词", copy:"复制提示词"},
    eidScope: '生效于：<b>追踪</b>、<b>资源</b>。不生效于：<b>对比</b>、<b>生成 AI 提示词</b>（二者使用默认事件）。',
    res: {blank:"执行一次查询…",
          hint:"[生成 AI 提示词] 先运行一次 diff",
          loading:"加载中…"},
    diff: {comparison:"对比结论", firstDivergence:"首个分歧",
           good:"A 值", bad:"B 值", layers:"分层"},
    trace: {target:"目标", modifications:"修改次数",
            finalValue:"最终值", reads:"读取来源",
            truncatedShort:"（已截断）",
            truncated:"追踪已截断 —— 仅显示较大修改集合中的 {n} 项。本结果不完整。",
            writtenBy:"写入者 {id}"},
    ci: {baseline:"CI 基线：未加载", pass:"CI 通过"},
    failure: {
      transport_error: "无法连接 rdebug-ide 服务",
      malformed: "服务返回的不是 JSON",
      api_error: "服务拒绝了该请求",
    },
  },
};
let LANG = "en";

function T(group, key, vars) {
  const table = I18N[LANG] || I18N.en;
  const fallback = I18N.en[group] || {};
  let s = (table[group] || {})[key];
  if (s === undefined) s = fallback[key];
  if (s === undefined) return "";
  if (vars) {
    for (const k of Object.keys(vars)) s = s.split("{" + k + "}").join(String(vars[k]));
  }
  return s;
}

// A key is either `group.key` or a bare top-level name such as eidScope. Both
// forms are resolved here rather than by each caller, because a caller that
// splits on "." and gets no dot does not fail -- it looks up a truncated name,
// misses, and leaves the element untranslated.
function resolve(key) {
  const dot = key.indexOf(".");
  if (dot < 0) {
    const table = I18N[LANG] || I18N.en;
    return table[key] !== undefined ? table[key] : I18N.en[key];
  }
  return T(key.slice(0, dot), key.slice(dot + 1));
}

function applyI18n(lang) {
  LANG = I18N[lang] ? lang : "en";
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  Object.assign(FAILURE_TEXT, I18N[LANG].failure);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const s = resolve(el.getAttribute("data-i18n"));
    if (s) el.textContent = s;
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const s = resolve(el.getAttribute("data-i18n-placeholder"));
    if (s) el.placeholder = s;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const s = resolve(el.getAttribute("data-i18n-html"));
    if (s) el.innerHTML = s;
  });
  const btn = $("btnLang");
  if (btn) btn.textContent = I18N[LANG].langLabel;
  try { localStorage.setItem("rdebug-ide-lang", LANG); } catch (e) { /* private mode */ }
  // Markup produced by the diff and trace views carries its own keys, so this
  // pass re-translates the labels already on screen without re-running a
  // renderer -- which the failure-containment contract forbids at this call
  // site anyway. Interpolated text (writer names, the truncation count) keeps
  // the language it was rendered in until the next query. That staleness is
  // accepted rather than hidden.
}

// Client result envelope. Internal to this page -- it is not the semantic API
// contract, and the server's JSON contract is unchanged.
//
// The server already distinguishes outcomes: route() returns a real status and
// always a JSON body. That distinction was being discarded here, which made an
// error body indistinguishable from a result and a transport failure an
// unhandled rejection. The four outcomes are therefore kept apart at the
// boundary:
//
//   ok:true                a valid payload, INCLUDING a valid empty one
//   ok:false kind:api_error      the server answered, and the answer was an error
//   ok:false kind:transport_error  fetch itself rejected
//   ok:false kind:malformed        the response body was not JSON
//
// `kind` exists to choose wording only. Deciding how the page should organise or
// display outcomes is a separate concern and is deliberately not done here.
async function api(path) {
  let r;
  try {
    r = await fetch(path);
  } catch (e) {
    return {ok:false, kind:"transport_error", message:String(e)};
  }
  let body;
  try {
    body = await r.json();
  } catch (e) {
    return {ok:false, kind:"malformed", status:r.status,
            message:"response body was not JSON"};
  }
  if (!r.ok) {
    return {ok:false, kind:"api_error", status:r.status,
            message:(body && body.error) || ("HTTP " + r.status)};
  }
  if (body && typeof body === "object" && body.error) {
    return {ok:false, kind:"api_error", status:r.status, message:body.error};
  }
  return {ok:true, data:body};
}

const FAILURE_TEXT = {
  transport_error: "Cannot reach the rdebug-ide service",
  malformed:       "The service returned a response that is not JSON",
  api_error:       "The service rejected the request",
};

// Entry guard. Every consumer starts here, so a failure can never reach a
// renderer as if it were data. This is containment, not a UI state machine:
// it reports and stops, and it does not decide how outcomes are organised.
function showFailure(result) {
  const kind = (result && result.kind) || "api_error";
  const detail = (result && result.message) || "";
  $("result").innerHTML =
    `<div class="banner banner-warn"><b>${esc(FAILURE_TEXT[kind] || FAILURE_TEXT.api_error)}</b>` +
    `<div>${esc(detail)}</div></div>`;
  return false;
}

function showOk(result) {
  if (!result || result.ok !== true) return showFailure(result);
  return true;
}

function enter(result, render) {
  if (!result || result.ok !== true) return showFailure(result);
  render(result.data);
  return true;
}

// Request identity is claimed when the user acts, not when a response arrives,
// so network timing cannot redefine which request counts as current. There is
// one global domain covering every render target rather than a counter per
// region, because two regions with separate counters could each believe they
// were the latest. A late response is discarded rather than allowed to
// overwrite whatever happened to be on screen, which is the same failure class
// as D1/D2/D7/D8 along the time axis instead of the input axis.
let currentSeq = 0;
function claim() { return ++currentSeq; }
function isStale(seq) { return seq < currentSeq; }

// The stale check runs before the P2-C containment rather than after it, so a
// discarded response cannot emit failure wording or clear a target on its way
// out. A stale response performs no DOM write at all, which is what makes the
// property testable rather than merely unlikely to be noticed.
function enterSeq(seq, result, render) {
  if (isStale(seq)) return false;
  return enter(result, render);
}

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function statusSpan(st){ return `<span class="st-${st}">${st}</span>`; }

function renderDiff(d) {
  lastDiff = d;
  const first = d.firstDivergence || {};
  const layers = d.layers.map(l =>
    `<div class="layer"><span style="width:190px;display:inline-block">${l.layer}</span>${statusSpan(l.status)}</div>`).join("");
  const good = first.good ? first.good.value : null;
  const bad = first.bad ? first.bad.value : null;
  $("result").innerHTML = `
    <div class="kv">
      <span class="k" data-i18n="diff.comparison">comparison</span><span>${statusSpan(d.comparison)}</span>
      <span class="k" data-i18n="diff.firstDivergence">first divergence</span><span>${esc(first.layer ?? "—")}</span>
      <span class="k" data-i18n="diff.good">good</span><span>${esc(JSON.stringify(good))}</span>
      <span class="k" data-i18n="diff.bad">bad</span><span>${esc(JSON.stringify(bad))}</span>
    </div>
    <h2 style="margin-top:10px" data-i18n="diff.layers">Layers</h2>${layers}`;
  const ids = [...new Set((function collect(n){ let o=[];
    if (Array.isArray(n)) return n.flatMap(collect);
    if (n && typeof n === "object") {
      if (n.id && n.operation) o.push(n);
      Object.values(n).forEach(v => o = o.concat(collect(v)));
    } return o; })(d.layers).map(e => e.id))];
  $("evidence").innerHTML = ids.length
    ? ids.map(id => `<span class="chip" data-id="${id}">${id}</span>`).join("")
    : "—";
  $("evidence").querySelectorAll(".chip").forEach(ch => ch.onclick = () => showEv(ch.dataset.id));
  $("btnExplain").disabled = false;
  // Availability follows the prompt that actually exists rather than the fact
  // that a diff happened, so an empty prompt cannot be copied as if it were a
  // real one. There is no capability probe: the state comes from what has
  // already happened, not from a prediction about the service.
  $("btnCopy").disabled = !$("prompt").value;
}

// The id arrives from the evidence chips, which the server already rendered in
// canonical form. Rewriting it meant stripping every non-digit and re-prefixing,
// which round-trips only for the one id shape that happens to survive it and
// silently corrupts any other. It is a pure function so the contract can be
// exercised directly rather than by reading the source: the id is either already
// canonical and is preserved byte for byte, or it is refused.
function canonicalResourceId(id) {
  const raw = (id || "").trim();
  if (!/^ResourceId::\d+$/.test(raw)) {
    return {ok:false, kind:"api_error",
            message:"not a canonical resource identifier: " + raw};
  }
  return {ok:true, data:{id:raw}};
}

async function showEv(id) {
  const seq = claim();
  const c = canonicalResourceId(id);
  if (!showOk(c)) return;
  const r = await api(
    `/api/resource?id=${encodeURIComponent(c.data.id)}${eidParam()}`);
  // The evidence panel is a different target from the result panel but shares
  // the one generation domain, so neither can outlive a newer user action.
  if (!enterSeq(seq, r, () => {
    $("evdetail").style.display = "block";
    $("evdetail").textContent = T("res", "loading");
  })) return;
}

function renderTrace(g) {
  lastDiff = null;
  const reads = g.edges.filter(e => e.label === "reads");
  const written = g.edges.filter(e => e.label === "written_by");
  // Truncation is reported by the semantic layer. Rendering the graph without
  // saying so would present an incomplete investigation as a complete one.
  const trunc = g.summary && g.summary.truncatedDraws;
  let html = trunc
    ? `<div class="banner banner-warn">${esc(T("trace", "truncated", {n: g.summary.modificationCount}))}</div>`
    : "";
  html += `<div class="kv">
    <span class="k" data-i18n="trace.target">target</span><span>${esc(g.summary.target ?? "")}</span>
    <span class="k" data-i18n="trace.modifications">modifications</span><span>${g.summary.modificationCount}${trunc ? T("trace", "truncatedShort") : ""}</span>
    <span class="k" data-i18n="trace.finalValue">final value</span><span>${esc(JSON.stringify(g.summary.finalValue))}</span></div>
    <h2 style="margin-top:10px" data-i18n="trace.reads">Reads</h2>`;
  for (const r of reads) {
    html += `<div>${esc(r.to)}</div><div class="tree">`;
    for (const w of written.filter(w => w.from === r.to)) {
      html += `<div>${esc(T("trace", "writtenBy", {id: w.to}))} <span class="muted">(${esc(w.evidence[0].data?.primitives ?? "")})</span></div>`;
    }
    html += `</div>`;
  }
  $("result").innerHTML = html;
  $("btnExplain").disabled = true; $("btnCopy").disabled = true;
  $("prompt").value = ""; $("evidence").innerHTML = "—";
}

// Applying an explain response is the only thing that writes the prompt. A
// failure is reported rather than swallowed, and the prompt is emptied so a
// prompt describing an earlier diff cannot be mistaken for this one. A stale
// response writes nothing at all, which is what keeps A6 true here too.
function applyExplain(data) {
  $("prompt").value = (data && data.prompt) || "";
  $("btnCopy").disabled = !$("prompt").value;
}

function clearExplain() {
  $("prompt").value = "";
  $("btnCopy").disabled = true;
}

// E2: this asks only for the prompt. It deliberately does not re-run the diff,
// because the previous wiring made the button a second diff button and the user
// asking for an explanation lost the result they were looking at.
async function doExplain() {
  const seq = claim();
  const a = $("a").value, b = $("b").value, deep = $("deep").checked ? 1 : 0;
  const p = await api(`/api/explain?a=${a}&b=${b}&deep=${deep}`);
  if (isStale(seq)) return;
  if (!enterSeq(seq, p, applyExplain)) clearExplain();
}

async function doDiff() {
  const seq = claim();
  const a = $("a").value, b = $("b").value, deep = $("deep").checked ? 1 : 0;
  $("result").innerHTML = "…";
  const d = await api(`/api/diff?a=${a}&b=${b}&deep=${deep}`);
  if (!enterSeq(seq, d, renderDiff)) return;
  // The prompt is still generated as part of a diff. This being a follow-up
  // rather than a result only means it is a stale write once the user has moved
  // on; it does not make its failure invisible.
  const p = await api(`/api/explain?a=${a}&b=${b}&deep=${deep}`);
  if (isStale(seq)) return;
  if (!enterSeq(seq, p, applyExplain)) clearExplain();
}

// Coordinate input contract: the value is either a well formed "x,y" or it is
// rejected. The previous form took the first token as x and fell back to "0"
// for a missing y, which quietly asked about a pixel the user never named.
// Synthesis is the defect, so this validates and refuses; it never guesses.
function parseCoord(text) {
  const raw = (text || "").trim();
  const m = /^(-?\d+)\s*,\s*(-?\d+)$/.exec(raw);
  if (!m) {
    return {ok:false, kind:"api_error",
            message:"coordinates must be written as x,y integers; got: " + raw};
  }
  return {ok:true, data:{x:parseInt(m[1], 10), y:parseInt(m[2], 10)}};
}

// Event context. The value is transported as typed; whether the event exists in
// this capture is decided by the action tree in the query layer, which already
// classifies an unknown event as bad_request. Nothing here infers a range from
// the number, because the valid set is membership rather than an interval.
// An empty field means no event context and is omitted entirely.
function eidParam() {
  const raw = ($("eid").value || "").trim();
  return raw ? "&eid=" + encodeURIComponent(raw) : "";
}

async function doTrace() {
  const seq = claim();
  const c = parseCoord($("a").value);
  if (!showOk(c)) return;
  const {x, y} = c.data;
  $("result").innerHTML = "…";
  // The investigation scope is sent explicitly rather than relying on a
  // server-side default the interface cannot show the user.
  const g = await api(`/api/trace?x=${x}&y=${y}&max_draws=${MAX_DRAWS}${eidParam()}`);
  if (!enterSeq(seq, g, renderTrace)) return;
}

async function loadCi() {
  const ciResult = await api("/api/ci");
  if (!showOk(ciResult)) return;
  const ci = ciResult.data;
  if (!ci.enabled) return;
  const el = $("cibase");
  if (ci.status === "pass") {
    el.innerHTML = `<span class="badge pass">${esc(T("ci", "pass"))}</span>`;
    return;
  }
  el.innerHTML = `<span class="badge regression">CI ${ci.status.toUpperCase()}</span>`;
  const box = $("ci");
  box.innerHTML = ci.failures.map((f,i) =>
    `<div class="layer"><button data-i="${i}">${esc(f.kind)} — ${esc(f.name)}</button></div>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => {
    const f = ci.failures[+b.dataset.i];
    if (f.pair) { $("a").value = f.pair.a.join(","); $("b").value = f.pair.b.join(","); doDiff(); }
    else if (f.pixel) { $("a").value = f.pixel.join(","); doTrace(); }
  });
}

$("btnDiff").onclick = doDiff;
$("btnTrace").onclick = doTrace;
$("btnExplain").onclick = doExplain;
$("btnLang").onclick = () => applyI18n(LANG === "zh" ? "en" : "zh");
$("btnCopy").onclick = () => { navigator.clipboard.writeText($("prompt").value); };

let storedLang = null;
try { storedLang = localStorage.getItem("rdebug-ide-lang"); } catch (e) { /* private mode */ }
applyI18n(storedLang || "en");
api("/api/info").then(i => { if (i.ok) $("capture").textContent = i.data.capture; });
loadCi();
</script>
</body>
</html>
